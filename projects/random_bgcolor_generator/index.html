<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random background Color Generator</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        border: none;
        outline: none;
        box-sizing: border-box;
        font-family: sans-serif;
      }

      body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(90deg, #833ab4, #fd1d1d);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        height: 200px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      button {
        background-color: #198cf8;
        padding: 10px 20px;
        border-radius: 20px;
        cursor: pointer;
      }

      .colorContainer {
        position: relative;
        top: 50px;
        width: 450px;
        height: 30px;
        border: 2px solid black;
        color: #fff;
        text-align: center;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button style="position: relative; top: 20px" id="generateBtn">
        #0f12FD
      </button>
      <div class="colorContainer">
        background-image: linear-gradient(90deg, #833ab4, #fd1d1d);
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
